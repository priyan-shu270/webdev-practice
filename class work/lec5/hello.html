<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,tr,td,th{
        border: 1px solid black;
        border-collapse: collapse;
     }
    </style>
    <!-- rowspan and colspan example -->
</head>
<body>
    <div>
        <table>
            <tr>
                <td rowspan="2"></td>
                <th colspan="3">Average</th>
                
                <th rowspan="2">Red eyes</th>
            </tr>
            <tr>
                
                <th colspan="2">height</th>
                <th>weight</th>
                
            </tr>
            <tr>
                <th>Male</th>
                <td colspan="2">1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr> 
            <tr>
                <th>female</th>
                <td colspan="2">1.9</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>
        </table>
    </div>
</body>
</html>
