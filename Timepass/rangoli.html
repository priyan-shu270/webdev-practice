<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna Rangoli</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080014;
            overflow: hidden;
        }

        /* MAIN RANGOLI */

        .rangoli {
            width: 600px;
            height: 600px;
            position: relative;
            border-radius: 50%;

            background:
                radial-gradient(circle,
                    #fff8dc 0%,
                    #ffd1dc 15%,
                    #b784ff 35%,
                    #5c189c 65%,
                    #16002e 100%);

            border: 8px solid #ffd700;

            box-shadow:
                0 0 20px #ffd700,
                0 0 50px #ff69b4,
                inset 0 0 50px #4b0082;
        }


        /* INNER CIRCLE */

        .inner {
            position: absolute;
            width: 440px;
            height: 440px;
            border-radius: 50%;

            top: 80px;
            left: 80px;

            border: 5px dashed #ffd700;

            box-shadow:
                0 0 20px #fff,
                inset 0 0 30px #ff69b4;
        }


        /* DECORATIVE DOTS */

        .dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;

            box-shadow: 0 0 10px #fff;
        }

        .d1 { top: 35px; left: 293px; }
        .d2 { top: 95px; left: 125px; }
        .d3 { top: 95px; right: 125px; }
        .d4 { bottom: 95px; left: 125px; }
        .d5 { bottom: 95px; right: 125px; }
        .d6 { bottom: 35px; left: 293px; }
        .d7 { top: 293px; left: 35px; }
        .d8 { top: 293px; right: 35px; }


        /* FLOWERS */

        .flower {
            position: absolute;
            width: 75px;
            height: 75px;
        }

        .petal {
            position: absolute;
            width: 30px;
            height: 45px;
            background: #ff1493;
            border-radius: 50%;
            left: 22px;
            top: 15px;

            box-shadow: 0 0 8px #ff69b4;
        }

        .p1 { transform: rotate(0deg) translateY(-25px); }
        .p2 { transform: rotate(60deg) translateY(-25px); }
        .p3 { transform: rotate(120deg) translateY(-25px); }
        .p4 { transform: rotate(180deg) translateY(-25px); }
        .p5 { transform: rotate(240deg) translateY(-25px); }
        .p6 { transform: rotate(300deg) translateY(-25px); }

        .flower::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            left: 27px;
            top: 27px;
            box-shadow: 0 0 10px #fff;
        }

        .flower1 {
            top: 40px;
            left: 260px;
        }

        .flower2 {
            bottom: 40px;
            left: 260px;
        }

        .flower3 {
            left: 40px;
            top: 260px;
        }

        .flower4 {
            right: 40px;
            top: 260px;
        }


        /* KRISHNA FACE */

        .krishna {
            position: absolute;

            width: 230px;
            height: 260px;

            top: 170px;
            left: 185px;

            background: linear-gradient(
                135deg,
                #75cfff,
                #2878d7,
                #1748a0
            );

            border-radius: 48% 52% 45% 45%;

            border: 5px solid #ffd700;

            box-shadow:
                0 0 20px #38bfff,
                inset 0 0 30px #0b2c75;

            z-index: 3;
        }


        /* KRISHNA HAIR */

        .hair {
            position: absolute;
            width: 190px;
            height: 70px;

            top: -25px;
            left: 18px;

            background: #111;

            border-radius: 50%;
        }

        .hair::before,
        .hair::after {
            content: "";
            position: absolute;

            width: 55px;
            height: 55px;

            background: #111;
            border-radius: 50%;
        }

        .hair::before {
            left: -20px;
            top: 25px;
        }

        .hair::after {
            right: -20px;
            top: 25px;
        }


        /* EYES */

        .eye {
            position: absolute;

            width: 48px;
            height: 25px;

            background: white;

            border-radius: 50%;

            top: 95px;

            box-shadow: 0 0 5px #fff;
        }

        .eye::after {
            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            background: #111;

            border-radius: 50%;

            left: 17px;
            top: 5px;

            box-shadow: 0 0 3px #000;
        }

        .left-eye {
            left: 38px;
        }

        .right-eye {
            right: 38px;
        }


        /* TILAK */

        .tilak {
            position: absolute;

            width: 18px;
            height: 48px;

            background: white;

            border-radius: 50%;

            top: 38px;
            left: 106px;

            box-shadow: 0 0 5px white;
        }

        .tilak::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 25px;

            background: #ff4500;

            left: 5px;
            top: 18px;

            border-radius: 50%;
        }


        /* NOSE */

        .nose {
            position: absolute;

            width: 20px;
            height: 45px;

            border-right: 4px solid #1748a0;

            border-radius: 50%;

            top: 120px;
            left: 105px;
        }


        /* SMILE */

        .smile {
            position: absolute;

            width: 75px;
            height: 35px;

            border-bottom: 6px solid #8b0038;

            border-radius: 50%;

            bottom: 45px;
            left: 75px;
        }


        /* FLUTE */

        .flute {
            position: absolute;

            width: 350px;
            height: 18px;

            background:
                linear-gradient(
                    #f6d365,
                    #b87316,
                    #f6d365
                );

            border: 3px solid #7a4300;

            border-radius: 20px;

            top: 390px;
            left: 125px;

            transform: rotate(-15deg);

            z-index: 6;

            box-shadow: 0 0 10px #ffd700;
        }


        .hole {
            position: absolute;

            width: 9px;
            height: 9px;

            background: #4b2100;

            border-radius: 50%;

            top: 3px;
        }

        .h1 { left: 80px; }
        .h2 { left: 125px; }
        .h3 { left: 170px; }
        .h4 { left: 215px; }
        .h5 { left: 260px; }


        /* PEACOCK FEATHER */

        .feather {
            position: absolute;

            width: 55px;
            height: 130px;

            background:
                radial-gradient(
                    ellipse,
                    #00ffff 5%,
                    #008b8b 30%,
                    #006400 70%
                );

            border-radius: 70% 30% 70% 30%;

            top: 90px;
            right: 115px;

            transform: rotate(25deg);

            border: 4px solid #ffd700;

            z-index: 8;
        }

        .feather::after {
            content: "";

            position: absolute;

            width: 30px;
            height: 45px;

            background:
                radial-gradient(
                    circle,
                    #ffd700 0%,
                    #00bfff 25%,
                    #00008b 50%,
                    #111 70%
                );

            border-radius: 50%;

            top: 35px;
            left: 9px;
        }


        /* LOTUS PETALS */

        .lotus {
            position: absolute;

            bottom: 90px;
            left: 215px;

            width: 170px;
            height: 80px;

            z-index: 5;
        }

        .lotus-petal {
            position: absolute;

            width: 65px;
            height: 85px;

            background: linear-gradient(
                #ff69b4,
                #ff1493
            );

            border-radius: 50% 50% 10% 10%;

            bottom: 0;

            border: 2px solid #ffd700;
        }

        .lp1 {
            left: 50px;
        }

        .lp2 {
            left: 15px;
            transform: rotate(-30deg);
        }

        .lp3 {
            right: 15px;
            transform: rotate(30deg);
        }


        /* SMALL DIYAS */

        .diya {
            position: absolute;

            width: 55px;
            height: 30px;

            background: #ff8c00;

            border-radius: 0 0 50px 50px;

            border: 3px solid #ffd700;

            box-shadow:
                0 0 15px #ff4500,
                0 0 25px #ffd700;
        }

        .diya::before {
            content: "🔥";

            position: absolute;

            top: -35px;
            left: 13px;

            font-size: 25px;
        }

        .diya1 {
            top: 180px;
            left: 75px;
        }

        .diya2 {
            top: 180px;
            right: 75px;
        }

        .diya3 {
            bottom: 180px;
            left: 75px;
        }

        .diya4 {
            bottom: 180px;
            right: 75px;
        }

    </style>
</head>

<body>

    <div class="rangoli">

        <div class="inner"></div>

        <!-- Decorative dots -->
        <div class="dot d1"></div>
        <div class="dot d2"></div>
        <div class="dot d3"></div>
        <div class="dot d4"></div>
        <div class="dot d5"></div>
        <div class="dot d6"></div>
        <div class="dot d7"></div>
        <div class="dot d8"></div>


        <!-- Flowers -->

        <div class="flower flower1">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
        </div>

        <div class="flower flower2">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
        </div>

        <div class="flower flower3">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
        </div>

        <div class="flower flower4">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
        </div>


        <!-- Krishna -->

        <div class="krishna">

            <div class="hair"></div>

            <div class="tilak"></div>

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="nose"></div>

            <div class="smile"></div>

        </div>


        <!-- Peacock feather -->

        <div class="feather"></div>


        <!-- Flute -->

        <div class="flute">
            <span class="hole h1"></span>
            <span class="hole h2"></span>
            <span class="hole h3"></span>
            <span class="hole h4"></span>
            <span class="hole h5"></span>
        </div>


        <!-- Lotus -->

        <div class="lotus">
            <div class="lotus-petal lp1"></div>
            <div class="lotus-petal lp2"></div>
            <div class="lotus-petal lp3"></div>
        </div>


        <!-- Diyas -->

        <div class="diya diya1"></div>
        <div class="diya diya2"></div>
        <div class="diya diya3"></div>
        <div class="diya diya4"></div>

    </div>

</body>
</html>
