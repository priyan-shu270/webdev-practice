<!DOCTYPE html>
<html>
<head>
    <title>Krishna Rangoli</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rangoli {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 5px solid #ffd700;
            position: relative;
            background: radial-gradient(
                circle,
                #fff8dc 0%,
                #ffb6c1 35%,
                #9370db 70%,
                #4b0082 100%
            );
        }

        /* Outer flowers */
        .flower {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff1493;
            border-radius: 50%;
            box-shadow:
                0 0 0 10px #ffd700,
                0 0 0 15px #ff4500;
        }

        .f1 { top: 20px; left: 225px; }
        .f2 { bottom: 20px; left: 225px; }
        .f3 { left: 20px; top: 225px; }
        .f4 { right: 20px; top: 225px; }

        /* Krishna face */
        .krishna {
            position: absolute;
            width: 220px;
            height: 220px;
            background: #6495ed;
            border-radius: 50%;
            top: 135px;
            left: 135px;
            border: 5px solid #ffd700;
        }

        /* Eyes */
        .eye {
            position: absolute;
            width: 35px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 75px;
        }

        .eye::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            left: 13px;
            top: 4px;
        }

        .left-eye {
            left: 45px;
        }

        .right-eye {
            right: 45px;
        }

        /* Tilak */
        .tilak {
            position: absolute;
            width: 12px;
            height: 40px;
            background: white;
            border-radius: 10px;
            top: 25px;
            left: 99px;
        }

        /* Nose */
        .nose {
            position: absolute;
            width: 15px;
            height: 35px;
            border-left: 4px solid #4169e1;
            border-radius: 50%;
            top: 95px;
            left: 105px;
        }

        /* Smile */
        .smile {
            position: absolute;
            width: 70px;
            height: 30px;
            border-bottom: 5px solid #8b0000;
            border-radius: 50%;
            bottom: 45px;
            left: 72px;
        }

        /* Flute */
        .flute {
            position: absolute;
            width: 280px;
            height: 15px;
            background: #deb887;
            border: 3px solid #8b4513;
            transform: rotate(-20deg);
            top: 205px;
            left: -30px;
            z-index: 5;
        }

        .hole {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #111;
            border-radius: 50%;
            top: 2px;
        }

        .h1 { left: 70px; }
        .h2 { left: 110px; }
        .h3 { left: 150px; }
        .h4 { left: 190px; }

        /* Peacock feather */
        .feather {
            position: absolute;
            width: 35px;
            height: 90px;
            background: #20b2aa;
            border-radius: 50%;
            top: 55px;
            right: 85px;
            transform: rotate(30deg);
            border: 3px solid #ffd700;
        }

        .feather::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 25px;
            background: #4169e1;
            border-radius: 50%;
            top: 25px;
            left: 7px;
        }

    </style>
</head>

<body>

    <div class="rangoli">

        <!-- Flowers -->
        <div class="flower f1"></div>
        <div class="flower f2"></div>
        <div class="flower f3"></div>
        <div class="flower f4"></div>

        <!-- Krishna -->
        <div class="krishna">

            <div class="tilak"></div>

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="nose"></div>

            <div class="smile"></div>

        </div>

        <!-- Flute -->
        <div class="flute">
            <span class="hole h1"></span>
            <span class="hole h2"></span>
            <span class="hole h3"></span>
            <span class="hole h4"></span>
        </div>

        <!-- Peacock Feather -->
        <div class="feather"></div>

    </div>

</body>
</html>
