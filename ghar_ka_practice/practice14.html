<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Basics</title>
<!-- 1. External CSS -->
<link rel="stylesheet" href="style.css">
<!-- 2. Internal CSS -->
<style>
h1 {
text-decoration: underline;
}
</style>
</head>
<body>
    <h1>CSS Basics</h1>
<p>A normal paragraph.</p>
<p class="highlight">A paragraph with a class.</p>
<p id="intro">A paragraph with an id.</p>
<div class="card">
<p>Paragraph inside a div (descendant selector).</p>
</div>
<!-- 3. Inline CSS -->
<p style="color: darkred; font-weight: bold;">Inline styled paragraph.</p>
<a href="#">Hover over me</a>
</body>
</html>
